<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Línea de Tiempo - FEM COMUNICACIONES</title>
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS Styling -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 3D Universe Canvas Background -->
    <canvas id="universeCanvas"></canvas>

    <!-- Ambient background glows -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>

    <!-- Floating Search Box (Top-Right Corner) -->
    <div class="hud-search-fixed">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Buscar actividad o fecha...">
        </div>
    </div>

    <!-- Brand Pill Badge (Bottom-Left Corner) -->
    <div class="brand-pill-badge">
        <div class="brand-pill-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F652A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <line x1="6" y1="12" x2="6" y2="7"></line>
                <circle cx="6" cy="5" r="2" fill="#F652A0"></circle>
                <line x1="18" y1="12" x2="18" y2="7"></line>
                <circle cx="18" cy="5" r="2" fill="#F652A0"></circle>
                <line x1="12" y1="12" x2="12" y2="17"></line>
                <circle cx="12" cy="19" r="2" fill="#F652A0"></circle>
            </svg>
        </div>
        <div class="brand-pill-info">
            <h2>FEM COMUNICACIONES</h2>
            <p>Linea de Tiempo de Actividades</p>
        </div>
    </div>

    <main class="app-main">
        <div class="timeline-container">
            <!-- Central timeline path line -->
            <div class="timeline-line"></div>
            
            <!-- Dynamic Saturdays will render here -->
            <div id="timelineItems" class="timeline-items">
                <!-- Loading State placeholder -->
                <div class="loading-state">
                    <i class="fa-solid fa-circle-notch fa-spin"></i>
                    <p>Cargando línea de tiempo del universo...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Image Lightbox Modal -->
    <div id="lightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <button class="lightbox-prev" aria-label="Anterior"><i class="fa-solid fa-chevron-left"></i></button>
        <div class="lightbox-content-container">
            <img id="lightboxImg" src="" alt="Vista ampliada">
            <p id="lightboxCaption" class="lightbox-caption"></p>
        </div>
        <button class="lightbox-next" aria-label="Siguiente"><i class="fa-solid fa-chevron-right"></i></button>
    </div>

    <!-- Toast Notification for Alerts -->
    <div id="toast" class="toast"></div>

    <!-- Three.js Library for 3D Universe -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Frontend JS Application Logic -->
    <script src="app.js"></script>
</body>
</html>
